<!-- @dsCard group="Layout" height=360 subtitle="Section head with a View all link over a three-column grid" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .hmd-section { padding-block: var(--space-12); }
  .demo { height: 140px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
  <section class="hmd-section" aria-labelledby="work-h">
    <div class="hmd-container">
      <div class="hmd-section__head">
        <div>
          <p class="hmd-eyebrow">Work</p>
          <h2 class="hmd-heading" id="work-h">Things I <span class="box">built</span></h2>
        </div>
        <a class="hmd-link" href="#">All work</a>
      </div>
      <div class="hmd-grid">
        <div class="demo">Card</div><div class="demo">Card</div><div class="demo">Card</div>
      </div>
    </div>
  </section>
</body>
</html>
