<!-- @dsCard group="Timeline" height=260 subtitle="Tag chips, year pill, timeline type markers" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  body { margin: 0; background: var(--ground); padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; }
  .legend { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="row">
    <span class="hmd-chip">Umbraco</span>
    <span class="hmd-chip">Bellissima</span>
    <span class="hmd-chip">SignalR</span>
    <span class="hmd-chip">Lit</span>
    <span class="hmd-chip">TypeScript</span>
    <span class="hmd-chip">.NET</span>
  </div>
  <div class="row">
    <span class="hmd-year">2025</span>
    <span class="hmd-year">2007 to 2011</span>
  </div>
  <div class="row">
    <span class="legend"><span class="hmd-marker hmd-marker--role"></span>Role</span>
    <span class="legend"><span class="hmd-marker hmd-marker--award"></span>Award</span>
    <span class="legend"><span class="hmd-marker hmd-marker--project"></span>Project</span>
    <span class="legend"><span class="hmd-marker hmd-marker--community"></span>Community</span>
  </div>
</body>
</html>
