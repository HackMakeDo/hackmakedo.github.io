<!-- @dsCard group="Timeline" height=140 subtitle="Three types shown, Community hidden" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style> body { margin: 0; background: var(--ground); padding: var(--space-8); } </style>
</head>
<body>
  <div class="hmd-filter" role="group" aria-label="Filter the timeline">
    <span class="hmd-filter__label">Show</span>
    <button type="button" aria-pressed="true"><span class="hmd-marker hmd-marker--role"></span>Role</button>
    <button type="button" aria-pressed="true"><span class="hmd-marker hmd-marker--award"></span>Award</button>
    <button type="button" aria-pressed="true"><span class="hmd-marker hmd-marker--project"></span>Project</button>
    <button type="button" aria-pressed="false"><span class="hmd-marker hmd-marker--community"></span>Community</button>
    <span class="hmd-filter__sep" aria-hidden="true"></span>
    <button type="button" aria-pressed="false">Oldest first ⇅</button>
  </div>
  <script>
    document.querySelectorAll('.hmd-filter button').forEach(function (b) {
      b.addEventListener('click', function () { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
    });
  </script>
</body>
</html>
