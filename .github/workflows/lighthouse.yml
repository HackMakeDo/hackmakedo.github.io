name: Lighthouse CI

on:
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx lhci autorun --config=./lighthouserc.${{ matrix.device }}.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.device }}
          path: .lighthouseci/${{ matrix.device }}
          retention-days: 14
